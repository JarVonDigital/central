<header class="header">
  <div class="nav-shell">
    <a
      class="brand"
      routerLink="/"
      aria-label="JarVonDigital home"
      (click)="close()"
      ><img
        src="/brand/header.svg"
        width="205"
        height="55"
        alt="JarVonDigital LLC — A simple connection." /></a
    ><button
      #toggle
      class="menu-toggle"
      type="button"
      [attr.aria-expanded]="open()"
      aria-controls="main-navigation"
      (click)="open.set(!open())"
    >
      {{ open() ? "Close" : "Menu" }}
      <span aria-hidden="true">{{ open() ? "−" : "+" }}</span>
    </button>
    <nav
      id="main-navigation"
      aria-label="Main navigation"
      [class.open]="open()"
    >
      @for (link of links; track link.fragment) {
        <a routerLink="/" [fragment]="link.fragment" (click)="close()">{{
          link.label
        }}</a>
      }
      <a
        class="button nav-cta"
        routerLink="/"
        fragment="inquiry"
        (click)="close()"
        >Request a quote <span aria-hidden="true">↗</span></a
      >
    </nav>
  </div>
</header>
